name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'style.css'
      - 'script.js'
      - 'content.json'
      - 'indexnow.json'
      - 'scripts/indexnow.py'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:
    inputs:
      since:
        description: 'Commit before the newly changed pages (do not submit historical pages)'
        required: true

permissions:
  contents: read

concurrency:
  group: indexnow-main
  cancel-in-progress: false

jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check IndexNow URL scope and deployment checks
        run: python3 -m unittest discover -s scripts -p 'test_indexnow.py'
      - name: Notify changed URLs after deployment
        env:
          BEFORE: ${{ github.event.before || inputs.since }}
        run: python3 scripts/indexnow.py --since "$BEFORE" --wait-seconds 600
